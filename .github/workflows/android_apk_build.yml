      - name: Configure Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          file = next((p for p in files if p.exists()), None)
          if file is None:
              raise SystemExit("Android Gradle build file not found")

          text = file.read_text()
          import re

          if file.suffix == ".kts":
              text, count = re.subn(
                  r"compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)",
                  "compileSdk = 36",
                  text,
              )
          else:
              text, count = re.subn(
                  r"compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)",
                  "compileSdk 36",
                  text,
              )

          if count != 1:
              raise SystemExit("Could not update compileSdk safely")

          file.write_text(text)
          print(f"Updated {file} to compileSdk 36")
          PY

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" || true
