name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android . \
              --project-name aizora_infinite_text_live \
              --org com.example
          fi

      - name: Configure Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          file = next((p for p in candidates if p.exists()), None)

          if file is None:
              raise SystemExit("Android Gradle file missing")

          content = file.read_text()

          if file.suffix == ".kts":
              pattern = r"(?m)^\s*compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$"
              replacement = "    compileSdk = 36"
          else:
              pattern = r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)\s*$"
              replacement = "    compileSdk 36"

          updated, count = re.subn(
              pattern,
              replacement,
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one compileSdk setting, found {count}"
              )

          file.write_text(updated)
          print(f"Configured compileSdk 36 in {file}")
          PY

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Android plugin compile SDK compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          pub_cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          package_names = (
              "audioplayers_android-*",
              "file_picker-*",
              "flutter_plugin_android_lifecycle-*",
          )
          files = []
          for package in package_names:
              files.extend(pub_cache.glob(f"hosted/pub.dev/{package}/android/build.gradle"))
              files.extend(pub_cache.glob(f"hosted/pub.dev/{package}/android/build.gradle.kts"))

          if not files:
              raise SystemExit("Android Gradle files for required Flutter plugins were not found")

          pattern = r"(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)\s*$"
          for file in files:
              source = file.read_text()
              updated, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + ("compileSdk = 36" if file.suffix == ".kts" else "compileSdkVersion 36"),
                  source,
              )
              if count == 0:
                  raise SystemExit(f"No compileSdk setting found to patch in {file}")
              file.write_text(updated)
              print(f"Configured compile SDK 36 in {file}")
          PY

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and rename APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" \
            build/app/outputs/flutter-apk/aizora-infinite-text-live-apk.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aizora-infinite-text-live-apk
          path: build/app/outputs/flutter-apk/aizora-infinite-text-live-apk.apk
          if-no-files-found: error
          retention-days: 7
