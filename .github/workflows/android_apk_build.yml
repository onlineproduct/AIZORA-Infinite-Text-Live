name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/live-preview-layout, feature/text-border-outline]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold if missing
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android . \
              --project-name aizora_infinite_text_live \
              --org com.example
          fi

      - name: Install native offscreen H264 encoder source
        run: |
          TARGET="android/app/src/main/kotlin/com/example/aizora_infinite_text_live"
          mkdir -p "$TARGET"
          cp native/android/AizoraH264Encoder.kt "$TARGET/AizoraH264Encoder.kt"
          cp native/android/AizoraRtmpsTransport.kt "$TARGET/AizoraRtmpsTransport.kt"
          cp native/android/AizoraRtmpCommands.kt "$TARGET/AizoraRtmpCommands.kt"
          cp native/android/AizoraAvcFlvPacketizer.kt "$TARGET/AizoraAvcFlvPacketizer.kt"
          cp native/android/AizoraRtmpChunkReader.kt "$TARGET/AizoraRtmpChunkReader.kt"
          cp native/android/AizoraRtmpSession.kt "$TARGET/AizoraRtmpSession.kt"

      - name: Configure foreground media service permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml missing after Flutter scaffold")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          android = "{http://schemas.android.com/apk/res/android}"
          tree = ET.parse(manifest)
          root = tree.getroot()

          required_permissions = (
              "android.permission.INTERNET",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
          )
          existing = {node.get(android + "name") for node in root.findall("uses-permission")}
          for permission in required_permissions:
              if permission not in existing:
                  ET.SubElement(root, "uses-permission", {android + "name": permission})

          app = root.find("application")
          if app is None:
              raise SystemExit("Android application node missing")
          service_name = "id.flutter.id_flutter_background_service.BackgroundService"
          # The plugin's manifest owns the actual service class; override its FGS type here.
          service_name = "id.flutter.flutter_background_service.BackgroundService"
          service = next((node for node in app.findall("service")
                          if node.get(android + "name") == service_name), None)
          if service is None:
              service = ET.SubElement(app, "service", {android + "name": service_name})
          # Let the plugin manifest define android:exported to avoid a manifest-merger conflict.
          service.set(android + "foregroundServiceType", "mediaPlayback")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("Configured Android media foreground-service permissions and type")
          PY

      - name: Configure Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          file = next((p for p in candidates if p.exists()), None)

          if file is None:
              raise SystemExit("Android Gradle file missing")

          content = file.read_text()

          if file.suffix == ".kts":
              pattern = r"(?m)^\s*compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)\s*$"
              replacement = "    compileSdk = 36"
          else:
              pattern = r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)\s*$"
              replacement = "    compileSdk 36"

          updated, count = re.subn(
              pattern,
              replacement,
              content
          )

          if count != 1:
              raise SystemExit(
                  f"Expected one compileSdk setting, found {count}"
              )

          file.write_text(updated)
          print(f"Configured compileSdk 36 in {file}")
          PY

      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Android plugin compile SDK compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          pub_cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          package_names = (
              "audioplayers_android-*",
              "file_picker-*",
              "flutter_plugin_android_lifecycle-*",
          )
          files = []
          for package in package_names:
              files.extend(pub_cache.glob(f"hosted/pub.dev/{package}/android/build.gradle"))
              files.extend(pub_cache.glob(f"hosted/pub.dev/{package}/android/build.gradle.kts"))

          if not files:
              raise SystemExit("Android Gradle files for required Flutter plugins were not found")

          pattern = r"(?m)^(\s*)compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.compileSdkVersion|\d+)\s*$"
          for file in files:
              source = file.read_text()
              updated, count = re.subn(
                  pattern,
                  lambda match: match.group(1) + ("compileSdk = 36" if file.suffix == ".kts" else "compileSdkVersion 36"),
                  source,
              )
              if count == 0:
                  raise SystemExit(f"No compileSdk setting found to patch in {file}")
              file.write_text(updated)
              print(f"Configured compile SDK 36 in {file}")
          PY

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify and rename APK
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          cp "$APK" \
            build/app/outputs/flutter-apk/aizora-infinite-text-live-apk.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aizora-infinite-text-live-apk
          path: build/app/outputs/flutter-apk/aizora-infinite-text-live-apk.apk
          if-no-files-found: error
          retention-days: 7
