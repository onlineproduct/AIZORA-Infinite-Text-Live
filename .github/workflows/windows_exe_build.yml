name: Windows EXE Build

on:
  push:
    branches: [main, feature/facebook-live-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows scaffold if missing
        shell: pwsh
        run: |
          if (!(Test-Path "windows/CMakeLists.txt")) {
            flutter create --platforms=windows . --project-name aizora_infinite_text_live --org com.example
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter project
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          if (!(Test-Path "build/windows/x64/runner/Release")) {
            throw "Windows release output folder was not found"
          }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "build/aizora-infinite-text-live-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: aizora-infinite-text-live-windows
          path: build/aizora-infinite-text-live-windows.zip
          if-no-files-found: error
          retention-days: 7
